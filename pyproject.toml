[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "readmeforge"
version = "0.1.0"
description = "Generate professional GitHub README files from project information."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "BYREX"}]
dependencies = []

[project.scripts]
readmeforge = "readmeforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
